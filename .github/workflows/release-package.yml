name: Build and publish Debian package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set package version from tag
        id: set_version
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['GITHUB_OUTPUT']
          path = Path('DEBIAN/control')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^(Version:\s*).+$', r'\g<1>' + os.environ['VERSION'], text, count=1, flags=re.MULTILINE)
          path.write_text(text, encoding='utf-8')
          print(f'Updated DEBIAN/control Version to {os.environ["VERSION"]}')
          PY

      - name: Create release package staging directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-staging
          mkdir -p .release-staging/package
          cp -a DEBIAN .release-staging/package/
          cp -a lib .release-staging/package/
          cp -a usr .release-staging/package/
          find .release-staging/package -type f \( -name 'README.md' -o -name 'LICENSE' -o -name '.prompt.md' \) -delete

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          cd .release-staging/package
          dpkg-deb --build . ../latitude-e7440-battery-nut-bridge_${{ steps.set_version.outputs.version }}_all.deb

      - name: Validate built package
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT=".release-staging/latitude-e7440-battery-nut-bridge_${{ steps.set_version.outputs.version }}_all.deb"
          test -f "$ARTIFACT"
          dpkg-deb --info "$ARTIFACT" | sed -n '1,12p'
          echo "Validated package artifact: $ARTIFACT"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: .release-staging/latitude-e7440-battery-nut-bridge_${{ steps.set_version.outputs.version }}_all.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
