name: Build and publish Debian package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release version from tag
        id: set_version
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          export VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing release snapshot for version $VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RELEASE_BRANCH="release/${VERSION}"
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']
          path = Path('DEBIAN/control')
          text = path.read_text(encoding='utf-8')
          updated = re.sub(r'^(Version:\s*).+$', rf'\g<1>{version}', text, count=1, flags=re.MULTILINE)
          path.write_text(updated, encoding='utf-8')
          print(f'Updated DEBIAN/control to version {version}')
          PY

          git checkout -B "$RELEASE_BRANCH"
          git add DEBIAN/control
          if git diff --cached --quiet; then
            echo "No version change needed"
          else
            git commit -m "Prepare release ${VERSION}"
            git push origin "$RELEASE_BRANCH" --force-with-lease
          fi

          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" --force-with-lease

      - name: Create release package staging directory
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.set_version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .release-staging
          mkdir -p .release-staging/source .release-staging/package
          tar --exclude='.git' --exclude='.release-staging' -cf - . | tar -xf - -C .release-staging/source
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('.release-staging/source/DEBIAN/control')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^(Version:\s*).+$', r'\g<1>' + os.environ['RELEASE_VERSION'], text, count=1, flags=re.MULTILINE)
          path.write_text(text, encoding='utf-8')
          print(f'Updated staged control file to {os.environ["RELEASE_VERSION"]}')
          PY
          cp -a .release-staging/source/DEBIAN .release-staging/package/
          cp -a .release-staging/source/lib .release-staging/package/
          cp -a .release-staging/source/usr .release-staging/package/
          find .release-staging/package -type f \( -name 'README.md' -o -name 'LICENSE' -o -name '.prompt.md' \) -delete
          tar --exclude='.git' --exclude='.release-staging' -czf ".release-staging/latitude-e7440-battery-nut-bridge_${RELEASE_VERSION}.tar.gz" -C .release-staging/source .

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          cd .release-staging/package
          dpkg-deb --build . ../latitude-e7440-battery-nut-bridge_${{ steps.set_version.outputs.version }}_all.deb

      - name: Validate built package
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT=".release-staging/latitude-e7440-battery-nut-bridge_${{ steps.set_version.outputs.version }}_all.deb"
          test -f "$ARTIFACT"
          dpkg-deb --info "$ARTIFACT" | sed -n '1,12p'
          echo "Validated package artifact: $ARTIFACT"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .release-staging/latitude-e7440-battery-nut-bridge_${{ steps.set_version.outputs.version }}_all.deb
            .release-staging/latitude-e7440-battery-nut-bridge_${{ steps.set_version.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
